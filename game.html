<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🐊 Croco Runner - GAME ZONE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0b0010;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;font-family:'Segoe UI',sans-serif;
  overflow:hidden;
}
canvas{
  display:block;
  background:linear-gradient(180deg,#1a0a2e,#0d001a);
  border:2px solid #6a00ff;
  border-radius:12px;
  box-shadow:0 0 40px #6a00ff44,0 0 80px #ff003c22;
  max-width:100vw;
}
.game-wrap{
  text-align:center;
  padding:20px;
}
.game-title{
  font-size:28px;font-weight:900;
  color:#fff;margin-bottom:16px;
  text-shadow:0 0 20px #6a00ff;
  letter-spacing:4px;
}
.game-title span{color:#ff003c}
.score{
  color:rgba(255,255,255,0.6);
  font-size:14px;margin-bottom:12px;
  font-family:'Courier New',monospace;
}
.controls{
  margin-top:16px;
  color:rgba(255,255,255,0.4);
  font-size:13px;
}
.controls kbd{
  background:rgba(106,0,255,0.2);
  border:1px solid #6a00ff;
  border-radius:4px;padding:2px 8px;
  color:#fff;
}
.retry-btn{
  display:none;
  margin:16px auto 0;
  background:#6a00ff;color:#fff;
  border:none;border-radius:8px;
  padding:10px 32px;
  font-size:16px;font-weight:700;
  cursor:pointer;transition:0.2s;
  font-family:inherit;
}
.retry-btn:hover{background:#ff003c;box-shadow:0 0 20px #ff003c66}
</style>
</head>
<body>
<div class="game-wrap">
  <div class="game-title">🐊 <span>CROCO</span> RUNNER</div>
  <div class="score" id="scoreDisplay">SCORE: 0</div>
  <canvas id="gameCanvas" width="600" height="300"></canvas>
  <div class="controls"><kbd>SPACE</kbd> or <kbd>TAP</kbd> to jump</div>
  <button class="retry-btn" id="retryBtn" onclick="restartGame()">↻ PLAY AGAIN</button>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreDisplay');
const retryBtn = document.getElementById('retryBtn');

let gameOver = false;
let score = 0;
let frame = 0;
let speed = 4;
let gravity = 0.5;
let jumpPower = -10;

const croco = {
  x: 60, y: 0, w: 40, h: 30,
  vy: 0,
  grounded: true,
};

const groundY = 250;

croco.y = groundY - croco.h;

let obstacles = [];
let frameCount = 0;
let minGap = 100;
let maxGap = 160;
let nextObstacleAt = 0;
let spawnCounter = 0;

function resetGame() {
  gameOver = false;
  score = 0;
  speed = 4;
  frame = 0;
  obstacles = [];
  croco.y = groundY - croco.h;
  croco.vy = 0;
  croco.grounded = true;
  spawnCounter = 0;
  nextObstacleAt = 80 + Math.random() * 40;
  retryBtn.style.display = 'none';
}

function drawCroco(x, y, w, h) {
  // body
  ctx.fillStyle = '#2d8a4e';
  ctx.shadowColor = '#00ff6444';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.ellipse(x + w/2, y + h/2, w/2, h/2.5, 0, 0, Math.PI*2);
  ctx.fill();

  // head
  ctx.fillStyle = '#3aa85e';
  ctx.beginPath();
  ctx.ellipse(x + w + 6, y + h/2 - 2, 14, 10, 0, 0, Math.PI*2);
  ctx.fill();

  // jaw
  ctx.fillStyle = '#2d8a4e';
  ctx.beginPath();
  ctx.ellipse(x + w + 14, y + h/2 + 2, 10, 6, 0, 0, Math.PI*2);
  ctx.fill();

  // eye
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x + w + 4, y + h/2 - 6, 4, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(x + w + 5, y + h/2 - 6, 2, 0, Math.PI*2);
  ctx.fill();

  // teeth
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(x + w + 6 + i*5, y + h/2 + 2);
    ctx.lineTo(x + w + 8 + i*5, y + h/2 + 2);
    ctx.lineTo(x + w + 7 + i*5, y + h/2 + 8);
    ctx.fill();
  }

  // spikes on back
  ctx.fillStyle = '#1d6a3e';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(x + 6 + i*12, y + 2);
    ctx.lineTo(x + 12 + i*12, y - 8);
    ctx.lineTo(x + 18 + i*12, y + 2);
    ctx.fill();
  }

  // legs
  ctx.fillStyle = '#1d6a3e';
  ctx.fillRect(x + 8, y + h - 4, 6, 6);
  ctx.fillRect(x + w - 14, y + h - 4, 6, 6);

  ctx.shadowBlur = 0;
}

function drawCactus(x, y, w, h) {
  ctx.fillStyle = '#5a3a1a';
  ctx.shadowColor = '#ff660044';
  ctx.shadowBlur = 8;
  // trunk
  ctx.fillRect(x + 2, y, w - 4, h);
  // branches
  ctx.fillRect(x - 4, y + 10, 10, 4);
  ctx.fillRect(x + w - 6, y + 16, 10, 4);
  ctx.fillRect(x, y + 24, 8, 4);
  // top
  ctx.beginPath();
  ctx.arc(x + w/2, y, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawGround() {
  ctx.fillStyle = 'rgba(106,0,255,0.08)';
  ctx.fillRect(0, groundY, canvas.width, 2);

  ctx.strokeStyle = 'rgba(106,0,255,0.15)';
  ctx.lineWidth = 1;
  for (let i = 0; i < canvas.width; i += 30) {
    const offset = (i + frame * speed * 0.5) % 60;
    if (offset < 30) {
      const x = i + (frame * speed * 0.5) % 30;
      ctx.beginPath();
      ctx.moveTo(x, groundY + 4);
      ctx.lineTo(x + 12, groundY + 4);
      ctx.stroke();
    }
  }
}

function spawnObstacle() {
  const h = 24 + Math.random() * 16;
  const w = 14 + Math.random() * 8;
  obstacles.push({
    x: canvas.width,
    y: groundY - h,
    w, h,
  });
}

function update() {
  if (gameOver) return;
  frame++;

  // croco physics
  croco.vy += gravity;
  croco.y += croco.vy;
  if (croco.y >= groundY - croco.h) {
    croco.y = groundY - croco.h;
    croco.vy = 0;
    croco.grounded = true;
  }

  // spawn
  spawnCounter++;
  if (spawnCounter >= nextObstacleAt) {
    spawnObstacle();
    spawnCounter = 0;
    nextObstacleAt = 70 + Math.random() * 60;
  }

  // move obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= speed;
    if (o.x + o.w < 0) {
      obstacles.splice(i, 1);
      score++;
      scoreEl.textContent = 'SCORE: ' + score;
    }
  }

  // collision
  for (const o of obstacles) {
    if (
      croco.x < o.x + o.w - 4 &&
      croco.x + croco.w - 4 > o.x &&
      croco.y < o.y + o.h - 2 &&
      croco.y + croco.h - 2 > o.y
    ) {
      gameOver = true;
      retryBtn.style.display = 'block';
    }
  }

  // speed up
  if (frame % 300 === 0 && speed < 10) speed += 0.3;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGround();
  for (const o of obstacles) drawCactus(o.x, o.y, o.w, o.h);
  drawCroco(croco.x, croco.y, croco.w, croco.h);

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff003c';
    ctx.font = 'bold 32px "Segoe UI",sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff003c';
    ctx.shadowBlur = 20;
    ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 10);
    ctx.shadowBlur = 0;
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function jump() {
  if (gameOver) {
    restartGame();
    return;
  }
  if (croco.grounded) {
    croco.vy = jumpPower;
    croco.grounded = false;
  }
}

function restartGame() {
  resetGame();
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    jump();
  }
});

canvas.addEventListener('click', jump);
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  jump();
});

resetGame();
loop();
</script>
</body>
</html>
